<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do App</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
  <h2>To-Do App</h2>
  <div id="filters">
    <button id="all" class="active">Semua</button>
    <button id="completed">Selesai</button>
    <button id="incomplete">Belum Selesai</button>

  </div>

  <input id="input" placeholder="Tulis tugas…">
  <button id="add">Tambah</button>
  <button id="clearComplete">tandai selesai semua</button>
  <ul id="list"></ul>
  
</div>

<script src="script.js"></script>

</body>
</html>
